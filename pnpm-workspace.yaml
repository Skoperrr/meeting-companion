# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  '@google/genai': true
  esbuild: true
  fsevents: true
  pnpm: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  miniflare>sharp: 0.35.4
minimumReleaseAgeExclude:
  - '@pnpm/exe.android-arm64@12.10.1'
  - '@pnpm/exe.android-x64@12.10.1'
  - '@pnpm/exe.darwin-arm64@12.10.1'
  - '@pnpm/exe.darwin-x64@12.10.1'
  - '@pnpm/exe.freebsd-x64@12.10.1'
  - '@pnpm/exe.linux-arm64-musl@12.10.1'
  - '@pnpm/exe.linux-arm64@12.10.1'
  - '@pnpm/exe.linux-ppc64@12.10.1'
  - '@pnpm/exe.linux-riscv64@12.10.1'
  - '@pnpm/exe.linux-s390x@12.10.1'
  - '@pnpm/exe.linux-x64-musl@12.10.1'
  - '@pnpm/exe.linux-x64@12.10.1'
  - '@pnpm/exe.win32-arm64@12.10.1'
  - '@pnpm/exe.win32-x64@12.10.1'
  - pnpm@12.10.1
